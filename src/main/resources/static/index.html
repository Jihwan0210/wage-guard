<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>노란돌고래 임금체불 프로토타입</title>
<style>
/* 레이아웃: 휴대폰은 한 열 + 아래 고정 버튼, 960px 이상은 상단 단계 표시 + 결과·진정서 두 열 */
:root {
  --bg: #FFFFFF;
  --surface: #F4F5F7;
  --fg: #16181D;
  --muted: #4E5461;
  --line: #E2E4E9;
  --input-line: #858B97;
  --strong-line: #16181D;
  --accent: #1F4E9C;
  --accent-fg: #FFFFFF;
  --accent-soft: #E8EEF8;
  --warn-bg: #FFF3C4;
  --warn-fg: #574100;
  --warn-line: #B8930A;
  --err: #B3261E;
  --off-bg: #E5E7EB;
  --off-fg: #5F6673;
  --paper: #FFFFFF;
  --tr-bg: #F0F2F5;
  --scrim: rgba(10, 12, 16, 0.5);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --r: 8px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1A1D22; --fg: #ECEEF2; --muted: #AAB0BB; --line: #2B2F37; --input-line: #737A87;
    --strong-line: #ECEEF2; --accent: #93B5F2; --accent-fg: #0C1526; --accent-soft: #1C283D;
    --warn-bg: #362D0C; --warn-fg: #F2DC8D; --warn-line: #9A7F1F; --err: #F2B8B5;
    --off-bg: #2A2E35; --off-fg: #A0A7B3; --paper: #1A1D22; --tr-bg: #22262D; --scrim: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1D22; --fg: #ECEEF2; --muted: #AAB0BB; --line: #2B2F37; --input-line: #737A87;
  --strong-line: #ECEEF2; --accent: #93B5F2; --accent-fg: #0C1526; --accent-soft: #1C283D;
  --warn-bg: #362D0C; --warn-fg: #F2DC8D; --warn-line: #9A7F1F; --err: #F2B8B5;
  --off-bg: #2A2E35; --off-fg: #A0A7B3; --paper: #1A1D22; --tr-bg: #22262D; --scrim: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
html { font-size: 100%; }
html.big { font-size: 118.75%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 1rem; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.5rem; line-height: 1.38; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h1:focus { outline: none; }
h2 { font-size: 1.0625rem; font-weight: 700; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in {
  max-width: 1080px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.icon-btn { width: 44px; height: 44px; margin-left: -12px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; border-radius: var(--r-sm); }
.top-title { flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: 1rem; }
.brand { font-weight: 700; font-size: 1rem; text-decoration: none; }
.brand small { font-weight: 400; color: var(--muted); font-size: 0.8125rem; margin-left: 4px; }
.steps-nav { display: none; margin: 0 auto; padding: 0; list-style: none; gap: 24px; font-size: 0.875rem; color: var(--muted); }
.steps-nav li[aria-current="step"] { color: var(--fg); font-weight: 700; box-shadow: inset 0 -2px 0 var(--fg); }
.top-tools { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.big-btn { min-width: 44px; height: 44px; border: 0; background: none; font-weight: 700; color: var(--muted); cursor: pointer; border-radius: var(--r-sm); }
.big-btn[aria-pressed="true"] { color: var(--accent); }
.lang-select { height: 44px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); font-size: 0.875rem; }

/* 본문 */
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 0; }
.col { max-width: 560px; margin-inline: auto; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.lead { color: var(--muted); font-size: 1rem; }
.hint { font-size: 0.8125rem; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: var(--r-sm); background: var(--accent-soft); font-size: 0.875rem; }
.proto { padding: 10px 14px; border-radius: var(--r-sm); border: 1px dashed var(--input-line); font-size: 0.8125rem; color: var(--muted); }

.progress { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.bar span { height: 4px; border-radius: 2px; background: var(--line); }
.bar span.on { background: var(--fg); }
.qbar { height: 4px; border-radius: 2px; background: var(--line); }
.qbar span { display: block; height: 4px; border-radius: 2px; background: var(--fg); }

/* 버튼 */
.btn { min-height: 52px; width: 100%; padding: 0 16px; border-radius: var(--r); border: 0; font-size: 1.0625rem; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:disabled { background: var(--off-bg); color: var(--off-fg); cursor: not-allowed; }
.btn-line { background: var(--bg); color: var(--fg); border: 1px solid var(--input-line); font-weight: 500; font-size: 1rem; min-height: 48px; }
.btn-line:disabled { color: var(--off-fg); border-color: var(--line); cursor: not-allowed; }
.btn-text { background: none; border: 0; min-height: 44px; padding: 0 4px; font-size: 0.9375rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.btn-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cta {
  position: sticky; bottom: 0; z-index: 3; background: var(--bg); border-top: 1px solid var(--line);
  margin-top: 28px; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px;
}
.cta .hint { text-align: center; }

/* 선택지·입력 */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.q-legend { font-size: 1.375rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: 1rem; font-weight: 500; }
.choice:has(input:checked) { border: 2px solid var(--fg); padding: 11px 15px; }
.choice input { width: 20px; height: 20px; margin: 0; accent-color: var(--fg); flex-shrink: 0; }
.choice small { display: block; font-weight: 400; color: var(--muted); font-size: 0.875rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 0.9375rem; font-weight: 600; }
.opt { font-weight: 400; color: var(--muted); }
.input { min-height: 50px; width: 100%; padding: 0 14px; border: 1px solid var(--input-line); border-radius: var(--r-sm); background: var(--bg); font-size: 1rem; }
textarea.input { padding: 12px 14px; line-height: 1.6; resize: vertical; }
.input[aria-invalid="true"] { border: 2px solid var(--err); }
.err { color: var(--err); font-size: 0.875rem; font-weight: 500; }
.readable { font-size: 0.875rem; color: var(--muted); min-height: 1.4em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
.day { min-height: 48px; border: 1px solid var(--input-line); border-radius: var(--r-sm); background: var(--bg); font-size: 1rem; cursor: pointer; }
.day[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.lang-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lang-btns button { min-height: 44px; border: 1px solid var(--input-line); border-radius: var(--r-sm); background: var(--bg); cursor: pointer; font-size: 0.9375rem; }
.lang-btns button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
details > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 500; list-style: none; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translateY(-3px); margin-left: auto; }
details[open] > summary::after { transform: rotate(-135deg) translateY(-1px); }
.note { padding: 14px 16px; border-radius: var(--r); background: var(--surface); font-size: 0.9375rem; }
.warnbox { padding: 14px 16px; border-radius: var(--r); background: var(--warn-bg); color: var(--warn-fg); }

/* 시작 */
.steps-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); counter-reset: s; }
.steps-list li { counter-increment: s; display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.steps-list li::before { content: counter(s); width: 20px; flex-shrink: 0; font-weight: 700; color: var(--muted); }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; cursor: pointer; }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }

/* 업로드 */
.drop { border: 1.5px dashed var(--input-line); border-radius: var(--r); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.filecard { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; width: 35%; background: var(--fg); animation: load 1.6s ease-out forwards; }
@keyframes load { to { width: 100%; } }

/* 확인 */
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8125rem; color: var(--muted); }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; line-height: 1.5; border: 1px solid var(--input-line); color: var(--fg); white-space: nowrap; }
.tag.self { background: var(--surface); border-color: var(--surface); }
.tag.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-fg); }
.group h2 { font-size: 0.9375rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.rows { margin: 0; border-top: 1px solid var(--strong-line); }
.row { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.row.low { background: var(--warn-bg); padding: 12px; margin-inline: -12px; border-radius: var(--r-sm); border-bottom-color: transparent; }
.row-main { display: flex; align-items: center; gap: 10px; }
.row dt { width: 6.5em; flex-shrink: 0; font-size: 0.875rem; color: var(--muted); }
.row.low dt, .row.low .row-note { color: var(--warn-fg); }
.row dd { margin: 0; flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 500; }
.row .empty { color: var(--muted); font-weight: 400; }
.row-edit { min-width: 44px; min-height: 44px; margin: -10px 0; display: flex; align-items: center; justify-content: flex-end; font-size: 0.875rem; background: none; border: 0; text-decoration: underline; cursor: pointer; }
.row-note { font-size: 0.875rem; }
.row .ok-btn { align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--warn-fg); background: var(--bg); color: var(--fg); font-weight: 600; cursor: pointer; }

/* 결과 */
.result-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "sum" "items" "act"; gap: 24px; align-items: start; }
.r-sum { grid-area: sum; }
.r-items { grid-area: items; }
.r-act { grid-area: act; }
.r-act .cta { position: static; }
.total-label { font-size: 0.9375rem; color: var(--muted); }
.total { font-size: 2.5rem; line-height: 1.12; font-weight: 700; letter-spacing: -0.03em; }
.total small { font-size: 1.375rem; font-weight: 600; margin-left: 2px; }
.total-read { font-size: 1rem; }
.disclaim { font-size: 0.75rem; color: var(--muted); }
.disclaim button { font-size: 0.75rem; color: inherit; padding: 0; min-height: 44px; }
.meta { font-size: 0.8125rem; color: var(--muted); padding-block: 10px; border-block: 1px solid var(--line); }
.items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--strong-line); }
.items li { padding: 12px 0 4px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.item-head { display: flex; align-items: baseline; gap: 8px; }
.item-head strong { flex: 1 1 auto; font-size: 1rem; }
.item-amt { font-size: 1.0625rem; font-weight: 700; white-space: nowrap; }
.item-status { font-size: 0.9375rem; color: var(--muted); white-space: nowrap; }
.item-exp { font-size: 0.875rem; color: var(--muted); }
.item-links { display: flex; align-items: center; gap: 14px; }
.basis summary { font-size: 0.8125rem; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.basis summary::after { display: none; }
.basis dl { margin: 0 0 10px; padding: 12px; border-radius: var(--r-sm); background: var(--surface); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 8px; font-size: 0.8125rem; }
.basis dt { color: var(--muted); }
.basis dd { margin: 0; }
.kv { margin: 0; display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 6px 8px; font-size: 0.875rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* 진정서 */
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: var(--r); background: var(--surface); }
.seg button { min-height: 44px; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.paper-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.paper { background: var(--paper); border: 1px solid var(--line); padding: 28px 20px; display: flex; flex-direction: column; gap: 20px; font-size: 0.9375rem; line-height: 1.75; }
.paper h2.doc-title { text-align: center; font-size: 1.25rem; letter-spacing: 0.3em; }
.paper section { display: flex; flex-direction: column; gap: 6px; }
.paper h3 { margin: 0; font-size: 0.9375rem; font-weight: 700; border-bottom: 1px solid var(--strong-line); padding-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.paper h3 span { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.paper table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.paper th, .paper td { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
.paper td.n, .paper th.n { text-align: right; }
.paper tr.sum th, .paper tr.sum td { font-weight: 700; border-bottom: 0; }
.paper .sign { text-align: right; }
.paper .foot { font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.paper p { white-space: pre-line; }
.tr-inline { padding: 10px 12px; border-radius: var(--r-sm); background: var(--tr-bg); font-size: 0.8125rem; line-height: 1.6; color: var(--muted); white-space: pre-line; }
.tr-col { display: none; background: var(--tr-bg); border-style: dashed; color: var(--muted); }
.tr-col h3 { border-bottom-color: var(--input-line); }
.paper.tr-col .doc-title { letter-spacing: 0; font-size: 1.125rem; }
.small-btn { align-self: flex-start; min-height: 44px; padding: 0 12px; border: 1px solid var(--input-line); border-radius: var(--r-sm); background: var(--bg); cursor: pointer; font-size: 0.8125rem; }
.copybox { width: 100%; min-height: 160px; }

/* 절차 */
.timeline { margin: 0; padding: 0; list-style: none; }
.timeline li { display: flex; gap: 14px; }
.tl-mark { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.tl-num { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 0.875rem; font-weight: 700; display: grid; place-items: center; }
.tl-line { width: 2px; flex: 1 1 auto; background: var(--line); margin: 4px 0; }
.tl-body { padding: 2px 0 22px; display: flex; flex-direction: column; gap: 4px; }
.tl-body p { font-size: 0.875rem; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 0 16px; }
.links a { min-height: 44px; display: flex; align-items: center; font-size: 0.875rem; font-weight: 600; }
.callout { display: flex; align-items: center; gap: 12px; padding: 16px; border: 2px solid var(--fg); border-radius: var(--r); background: var(--bg); text-align: left; cursor: pointer; width: 100%; }
.callout span { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.callout small { color: var(--muted); font-size: 0.875rem; }
.phones { display: flex; flex-direction: column; gap: 8px; }
.phone { min-height: 56px; padding: 8px 14px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; }
.phone span { display: flex; flex-direction: column; }
.phone small { color: var(--muted); font-size: 0.8125rem; }
.phone b { font-size: 1.125rem; }

/* 상담원 */
.counsel { font-size: 1.0625rem; }
.counsel .kv { font-size: 1rem; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px 8px; }

/* 확인 창 */
dialog { border: 0; border-radius: 10px; padding: 24px 20px; width: min(440px, calc(100% - 32px)); background: var(--bg); color: var(--fg); }
dialog::backdrop { background: var(--scrim); }
dialog .stack { gap: 14px; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: min(440px, calc(100% - 32px)); padding: 12px 16px; border-radius: var(--r); background: var(--fg); color: var(--bg); font-size: 0.9375rem; }

@media (min-width: 960px) {
  .only-m { display: none !important; }
  .steps-nav { display: flex; }
  .top-title { flex: 0 0 auto; }
  .wrap { padding-block: 32px 48px; }
  .cta { position: static; border: 0; padding-block: 0; background: none; }
  .result-grid { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); grid-template-areas: "sum items" "act items"; gap: 24px 40px; }
  .r-act { position: static; }
  .wide { max-width: 1080px; }
  .paper-grid.tr-on { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .paper-grid .tr-inline { display: none; }
  .paper-grid.tr-on .tr-col { display: flex; }
  .paper { padding: 40px 36px; }
  .toast { bottom: 32px; }
}
@media print {
  body::before, .top, .cta, .no-print, .proto, .banner, .tr-col, .tr-inline, .toast, .progress { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .paper { border: 0; padding: 0; }
  body { background: #FFFFFF; color: #000000; }
}
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var KEY = 'wage-proto-v1';
  var DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  var MIN_WAGE = 10320;
  var MAX_SIZE = 10 * 1024 * 1024;
  var ALL = ['start', 'upload', 'q1', 'q2', 'q3', 'q4', 'q5', 'q6', 'review', 'result', 'form', 'complaint', 'guide', 'counselor'];
  var STEP = { upload: 1, q1: 1, q2: 1, q3: 1, q4: 1, q5: 1, q6: 1, review: 2, result: 3, form: 4, complaint: 4 };

  // ---------- 화면: 직접 입력 ----------
  function qShell(n, legend, help, body) {
    var pct = Math.round(n / 6 * 100);
    return '<div class="col stack-lg">' +
      '<div class="progress"><div class="qbar" aria-hidden="true"><span style="width:' + pct + '%"></span></div><span class="hint">필수 질문 ' + n + ' / 6</span></div>' + langBanner() +
      '<fieldset class="stack"><legend class="q-legend"><h1 tabindex="-1" style="font-size:inherit">' + legend + '</h1></legend>' +
      (help ? '<p class="lead" style="font-size:0.9375rem">' + help + '</p>' : '') + body + '</fieldset></div>';
  }
  function nextCta(r) {
    var next = { q1: 'q2', q2: 'q3', q3: 'q4', q4: 'q5', q5: 'q6', q6: 'review' }[r];
    var label = r === 'q6' ? '입력한 내용 확인하기' : '다음 질문';
    return cta(primary(label, 'data-go="' + next + '" data-next', valid(r)) +
      '<p class="hint" data-next-hint' + (valid(r) ? ' hidden' : '') + '>답을 고르거나 입력하면 넘어갈 수 있어요</p>');
  }
  function radios(name, key, list) {
    return '<div class="choices">' + list.map(function (o) {
      return '<label class="choice"><input type="radio" name="' + name + '" value="' + o[0] + '" data-f="' + key + '"' + (S.f[key] === o[0] ? ' checked' : '') + '><span>' + o[1] + (o[2] ? '<small>' + o[2] + '</small>' : '') + '</span></label>';
    }).join('') + '</div>';
  }

      (S.f.size === 'unsure' ? '<p class="note" role="status">괜찮아요. 5명 이상으로 계산하고 결과에 \'추정\'이라고 표시할게요.</p>' : '') +
      '<details><summary>왜 물어보나요?</summary><p class="hint" style="font-size:0.9375rem">직원이 5명보다 적은 곳은 연장·야간·휴일에 더 얹어 주는 수당이 법으로 정해져 있지 않아요. 주휴수당과 퇴직금은 직원 수와 상관없이 받을 수 있어요.</p></details>') + nextCta('q1');

      '<div class="field"><label for="start">입사일</label><input id="start" class="input" type="date" data-f="start" value="' + esc(S.f.start) + '" max="2026-12-31"></div>') + nextCta('q2');

  function vQ4() {

    }

    }).join('');
    var h = hours(), cnt = f.days.filter(Boolean).length;
    var sum = '';
    if (f.tStart !== '' && f.tEnd !== '' && f.brk !== '' && h <= 0) sum = '<p class="err" role="alert">퇴근 시각이 출근 시각보다 늦어야 해요.</p>';
    else if (h > 0 && cnt) sum = '<p class="note" role="status">하루 <strong>' + h + '시간</strong> · 일주일 <strong>' + (h * cnt) + '시간</strong>으로 계산할게요.</p>';

  function vQ5() {

    return qShell(5, '급여는 어떻게<br>약속했나요?', '실제로 받은 돈이 아니라, 처음에 약속한 금액이에요.',
      radios('wageType', 'wageType', [['hour', '시급'], ['day', '일급'], ['month', '월급']]) +
      '<div class="field"><label for="wage">약속한 금액 (원)</label><input id="wage" class="input" type="text" inputmode="numeric" autocomplete="off" data-f="wage" data-live value="' + esc(f.wage) + '"><p class="readable" data-readable="wage" aria-live="polite">' + readable(f.wage) + '</p></div>' + warn) + nextCta('q5');
  }
  function vQ6() {
    var f = S.f;

      return '<div class="field"><label for="' + id + '">' + label + ' <span class="opt">(' + unit + ')</span></label><input id="' + id + '" class="input" type="text" inputmode="numeric" autocomplete="off" data-f="' + key + '" data-live value="' + esc(f[key]) + '"></div>';

      '<div class="field"><label for="paid">실제로 받은 돈 (원)</label><input id="paid" class="input" type="text" inputmode="numeric" autocomplete="off" data-f="paid" data-live value="' + esc(f.paid) + '"><p class="readable" data-readable="paid" aria-live="polite">' + readable(f.paid) + '</p></div>' +
      '<details' + (f.ot || f.night || f.holiday || f.allowance || f.month ? ' open' : '') + '><summary>자세히 · 연장·야간·휴일 근무, 그 밖의 수당 <span class="opt" style="margin-left:4px">선택</span></summary><div class="stack" style="padding-bottom:8px">' +
      '<p class="hint">입력하지 않으면 결과에 0원이 아니라 \'정보 없음\'으로 나와요.</p>' +

      num('ot', 'ot', '정해진 시간보다 더 일한 시간', '시간') + num('night', 'night', '그중 밤 10시~아침 6시', '시간') + num('holiday', 'holiday', '휴일에 일한 시간', '시간') + num('allow', 'allowance', '매달 같은 금액으로 받은 수당', '원') +
      '</div></details>') + nextCta('q6');
  }

  // ---------- 화면: 내용 확인 ----------
  function vReview() {
    var f = S.f;
    // key: 줄 이름 (S.src · S.low · S.unread · S.fieldErr 공통)
    function row(label, value, key, goTo) {
      var src = S.src[key];
      var low = S.low[key] && !S.ok[key];
      var checked = S.low[key] && S.ok[key];
      var err = S.fieldErr[key];
      var val = value ? '<span>' + esc(value) + '</span>' : '<span class="empty">' + (S.unread[key] ? t('review.unread') : '입력 안 함') + '</span>';
      var tag = src === 'doc' ? '<span class="tag">서류</span>' : src === 'self' ? '<span class="tag self">직접</span>' : '';
      return '<div class="row' + (low ? ' low' : '') + '"><div class="row-main"><dt>' + label + '</dt><dd>' + val + tag + (checked ? '<span class="hint">확인함</span>' : '') + '</dd>' +
        '<button type="button" class="row-edit" data-go="' + goTo + '" aria-label="' + label + ' 수정">수정</button></div>' +
        (err ? '<p class="err" role="alert">' + esc(err) + '</p>' : '') +
        (low ? '<p class="row-note">흐리게 읽혔어요. 서류와 같은 값인가요?</p><button type="button" class="ok-btn" data-act="ok" data-k="' + key + '">네, 맞아요</button>' : '') + '</div>';
    }
    var wageLabel = { hour: '시급', day: '일급', month: '월급' }[f.wageType] || '';
    var timeText = f.tStart !== '' && f.tEnd !== '' ? hh(f.tStart) + ' ~ ' + hh(f.tEnd) + (f.brk !== '' ? ' · 쉬는 시간 ' + ({ '0': '없음', '0.5': '30분', '1': '1시간', '1.5': '1시간 30분' }[f.brk]) : '') : f.dayHours ? f.dayHours + '시간' : '';
    var groups = [
      ['일한 곳', (f.company ? row('사업장 이름', f.company, 'company', 'q1') : '') + row('직원 수', { five: '5명 이상', under: '5명 미만', unsure: '모름 (5명 이상으로 추정)' }[f.size], 'size', 'q1')],
      ['일한 기간', row('입사일', krDate(f.start), 'start', 'q2') + row('퇴사일', f.employed === 'yes' ? '지금도 다니는 중' : krDate(f.end), 'end', 'q3')],
      ['근무 시간', row('일한 요일', dayText(), 'days', 'q4') + row('하루', timeText, 'time', 'q4')],
      ['약속한 급여', row(wageLabel || '급여', f.wage ? won(f.wage) : '', 'wage', 'q5') + row('매달 받는 수당', f.allowance ? won(f.allowance) : '', 'allowance', 'q6')],
      ['받은 돈 · 추가 근무', (f.month || S.unread.month ? row('못 받은 달', f.month ? Number(f.month.slice(0, 4)) + '년 ' + Number(f.month.slice(5)) + '월' : '', 'month', 'q6') : '') + row('실제 받은 돈', f.paid !== '' ? won(f.paid) : '', 'paid', 'q6') + row('연장 근무', f.ot ? f.ot + '시간' : '', 'ot', 'q6') + row('그중 야간', f.night ? f.night + '시간' : '', 'night', 'q6') + row('휴일 근무', f.holiday ? f.holiday + '시간' : '', 'holiday', 'q6')]
    ].map(function (g) { return '<section class="group"><h2>' + g[0] + '</h2><dl class="rows">' + g[1] + '</dl></section>'; }).join('');
    var left = lowLeft();
    var ok = valid('review');
    return '<div class="col stack-lg">' + progress(2) + langBanner() +
      '<div class="stack"><h1 tabindex="-1">읽은 내용이 맞는지<br>확인해 주세요</h1><p class="lead">잘못 읽힌 값이 있으면 계산 전체가 틀려져요.</p></div>' +
      '<div class="legend-row"><span><span class="tag">서류</span> 서류에서 읽은 값</span><span><span class="tag self">직접</span> 직접 입력한 값</span><span><span class="tag warn">노란 줄</span> 확인 필요</span></div>' +
      groups + '</div>' +

  // ---------- 동작 ----------
  // POST /documents/extract 응답 → 확인 화면 값. 0.8 미만은 노란 줄, unreadable 은 빈칸
  // 서류를 하나씩 올리면 앞 서류에서 읽은 값에 덧붙인다
  function applyExtract(res) {
    var f = S.f;
    var weekly = 0;
    res.fields.forEach(function (x) {
      var v = x.value, row = ROW_OF[x.key];
      if (!row || v == null) return;
      if (x.key === 'companyName') f.company = String(v);
      else if (x.key === 'employeeCount') f.size = Number(v) >= 5 ? 'five' : 'under';
      else if (x.key === 'startDate') f.start = v;
      else if (x.key === 'endDate') { f.end = v; f.employed = 'no'; }
      // 주 n일 → 월요일부터 n일로 둔다 (확인 화면에서 고칠 수 있음)
      else if (x.key === 'workDaysPerWeek') f.days = DAYS.map(function (_, i) { return i < Number(v); });
      else if (x.key === 'dailyContractHours') f.dayHours = String(v);
      else if (x.key === 'weeklyContractHours') weekly = Number(v);
      else if (x.key === 'wageType') f.wageType = { HOURLY: 'hour', DAILY: 'day', MONTHLY: 'month' }[v] || '';
      else if (x.key === 'baseWage') f.wage = String(v);
      else if (x.key === 'allowances') f.allowance = String(v.reduce(function (s, a) { return s + Number(a.amount); }, 0) || '');
      else if (x.key === 'payMonth') f.month = v;
      else if (x.key === 'paidAmount') f.paid = String(v);
      else f[row] = String(v);
      S.src[row] = 'doc';
      S.low[row] = x.confidence < 0.8;
      S.ok[row] = false;
    });
    var cnt = f.days.filter(Boolean).length;
    if (!f.dayHours && weekly && cnt) f.dayHours = String(weekly / cnt);
    (res.unreadable || []).forEach(function (k) { if (ROW_OF[k]) S.unread[ROW_OF[k]] = true; });
    S.up.n = res.fields.length;
    S.up.unread = (res.unreadable || []).length;
    S.up.masked = res.maskedCount || 0;
  }
  function handleFile(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var name = file.name.toLowerCase();
    var okType = /\.(pdf|jpe?g|png)$/.test(name) || /^(application\/pdf|image\/jpeg|image\/png)$/.test(file.type);
    if (/\.hwp$/.test(name)) S.up = { status: 'error', name: file.name, msg: t('up.hwp') };
    else if (!okType) S.up = { status: 'error', name: file.name, msg: t('err.415') };
    else if (file.size > MAX_SIZE) S.up = { status: 'error', name: file.name, msg: t('err.413') };
    else {
      var form = new FormData();
      form.append('file', file);
      form.append('docType', S.docType.toUpperCase());
      S.up = { status: 'reading', name: file.name, msg: '' };
      api('/api/v1/documents/extract', form).then(function (res) {
        applyExtract(res);
        S.up.status = 'done';
        toast(t('up.toast'));
      }, function (e) {
        // 422 는 직접 입력 안내, 나머지(413·415·429 등)는 안내 문구
        S.up = { status: e.status === 422 ? 'fail' : 'error', name: file.name, msg: e.message };
      }).then(function () {
        if (S.route === 'upload') render(); else save();
      });
    }
    render();
  }
  function setField(el) {
    var key = el.dataset.f;
    var v = el.value;
    if (el.hasAttribute('data-live')) {
      v = v.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
      if (el.value !== v) el.value = v;
    }
    S.f[key] = v;
    var srcKey = (key === 'tStart' || key === 'tEnd' || key === 'brk') ? 'time' : key === 'wageType' ? 'wage' : key === 'employed' ? 'end' : key;
    S.src[srcKey] = 'self';
    S.low[srcKey] = false;
    S.fieldErr[srcKey] = '';
    save();
  }
  function refreshNext() {
    var r = S.route;

    var btn = app.querySelector('[data-next]');
    if (btn) btn.disabled = !ok;
    var hint = app.querySelector('[data-next-hint]');

    } catch (e) { fail(); }

  function make() {
    var p = S.p;
    var need = ['name', 'phone', 'owner', 'waddr', 'job'];
    if (!S.f.company) need.push('company');
    S.formTried = true;

  // 언어를 바꾸면 문구 파일을 받고, 해설도 그 언어로 다시 받는다
  function setLang(v) {
    S.lang = v;

  function toastT(k) { toast(t(k)); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-act]');
    if (!t || t.disabled) return;
    if (t.dataset.go !== undefined && t.dataset.go !== '') { go(t.dataset.go); return; }
    var a = t.dataset.act;
    if (a === 'back') back();
    else if (a === 'big') { S.big = !S.big; render(); }
    else if (a === 'lang') setLang(t.dataset.v);
    else if (a === 'path') {
      S.path = t.dataset.v;
      // 서류로 시작하거나 서류 없이 직접 입력하면 빈 칸부터
      if (S.path === 'doc' || S.up.status !== 'done') { S.f = blankFields(); S.src = {}; S.low = {}; S.ok = {}; S.unread = {}; S.fieldErr = {}; }
      if (S.path === 'doc') S.up = { status: 'idle', name: '', msg: '' };
      go(S.path === 'manual' ? 'q1' : 'upload');
    }
    else if (a === 'day') { var i = Number(t.dataset.i); S.f.days[i] = !S.f.days[i]; S.src.days = 'self'; S.low.days = false; render(); var again = app.querySelector('[data-act="day"][data-i="' + i + '"]'); if (again) again.focus(); }
    else if (a === 'ok') { S.ok[t.dataset.k] = true; render(); }
    else if (a === 'disclaim') toastT('result.disclaimToast');
    else if (a === 'calculate') calculate(t);
    else if (a === 'print') doPrint();
    else if (a === 'copy') doCopy();
    else if (a === 'make') make();
    else if (a === 'confirm-make') makeDraft(t);
    else if (a === 'close-dialog') { var d2 = document.getElementById('confirm'); if (d2) d2.close(); }
    else if (a === 'tr') { S.tr = t.dataset.v === '1'; render(); }
    else if (a === 'facts-edit') { S.editing = true; render(); var ta = document.getElementById('facts-edit'); if (ta) ta.focus(); }
    else if (a === 'facts-cancel') { S.editing = false; render(); }
    else if (a === 'facts-save') { S.factsText = document.getElementById('facts-edit').value; S.editing = false; render(); toast('진정 내용을 고쳤어요'); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    var a = t.dataset.act;
    if (a === 'agree') { S.agreed = t.checked; render(); var c = document.getElementById('agree'); if (c) c.focus(); }
    else if (a === 'lang-select') setLang(t.value).then(function () { var s = document.getElementById('lang-top'); if (s) s.focus(); });
    else if (a === 'doctype') { S.docType = t.value; save(); }
    else if (a === 'file') handleFile(t);
    else if (t.dataset.f !== undefined && !t.hasAttribute('data-live')) {
      setField(t);
      var id = t.id, val = t.value;
      render();
      var back2 = id ? document.getElementById(id) : app.querySelector('[data-f="' + t.dataset.f + '"][value="' + val + '"]');
      if (back2) back2.focus();
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-live')) { setField(t); refreshNext(); }
    else if (t.dataset.p !== undefined) { S.p[t.dataset.p] = t.value; S.pErr[t.dataset.p] = ''; save(); }
  });

  var start = (location.hash || '').slice(1);
  if (ALL.indexOf(start) >= 0 && (start === 'start' || S.agreed)) S.route = start;
  if (NEED_CALC.indexOf(S.route) >= 0 && !S.calc) S.route = 'review';
  if (S.route === 'complaint' && !S.draft) S.route = 'form';
  // 한국어(기본 문구)와 고른 언어 문구를 받은 뒤 그린다
  Promise.all([loadLang('ko'), loadLang(S.lang)]).then(function () { render(false); });
})();
</script>
</body>
</html>
