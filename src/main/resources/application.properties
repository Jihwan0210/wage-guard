spring.application.name=wageback

spring.servlet.multipart.max-file-size=10MB
# 여러 장 올리기: 장당 10MB x 최대 6장
spring.servlet.multipart.max-request-size=60MB

spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# 화면 파일은 쓸 때마다 서버에 바뀌었는지 묻는다 (배포 뒤 예전 화면이 남지 않게, 안 바뀌었으면 304로 가볍게 끝남)
spring.web.resources.cache.cachecontrol.no-cache=true

# LLM 키 파일 (프로젝트 폴더의 llm-keys.properties, git 에 안 올림). 없으면 환경변수만 본다
spring.config.import=optional:file:./llm-keys.properties
